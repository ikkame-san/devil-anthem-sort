name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Check JavaScript and sorting algorithm
        run: |
          npm run check
          npm test
      - uses: actions/configure-pages@v5
      - name: Package public files only
        run: |
          mkdir _site
          cp index.html styles.css app.js engine.js songs.js jackets.js favicon.svg _site/
          sed -i "s|styles.css|styles.css?v=$GITHUB_SHA|;s|app.js|app.js?v=$GITHUB_SHA|" _site/index.html
          sed -i "s|./jackets.js|./jackets.js?v=$GITHUB_SHA|" _site/app.js
          touch _site/.nojekyll
      - name: Package official jacket images
        run: node scripts/build-jackets.mjs _site/jackets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
